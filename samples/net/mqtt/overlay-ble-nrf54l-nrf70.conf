# Minimal Bluetooth LE enablement for Wi-Fi + BLE coexistence on nRF54L with nRF7002 EB II

CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="MQTT_BLE"

# nRF7002 SR coexistence (requires nrf7002eb2_coex shield)
CONFIG_NRF70_SR_COEX=y
CONFIG_NRF70_SR_COEX_RF_SWITCH=y
CONFIG_MPSL_CX=y

# BLE stack sizing (coexistence with Wi-Fi)
CONFIG_BT_RX_STACK_SIZE=22000
CONFIG_BT_BUF_ACL_RX_SIZE=151
CONFIG_BT_L2CAP_TX_MTU=147
CONFIG_BT_BUF_ACL_TX_SIZE=151
